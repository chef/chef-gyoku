---
expeditor:
  cached_folders:
    - vendor

steps:

- label: run-specs-ruby-3.1
  command:
    - bundle install --jobs=7 --retry=3
    - bundle exec rake spec
  expeditor:
    executor:
      docker:
        image: ruby:3.1

- label: run-specs-ruby-4.0
  command:
    - bundle install --jobs=7 --retry=3
    - bundle exec rake spec
  expeditor:
    executor:
      docker:
        image: ruby:4.0
