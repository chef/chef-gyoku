AllCops:
  # Kept in sync with required_ruby_version in chef-gyoku.gemspec. Cookstyle's
  # chefstyle config hardcodes 3.0, so removing this line does not fall back to
  # the gemspec -- it silently lints against 3.0 instead.
  TargetRubyVersion: 3.1
  Exclude:
    - "spec/data/**/*"
    - "vendor/**/*"
    - "pkg/**/*"
